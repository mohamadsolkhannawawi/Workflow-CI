name: MLflow CI + Docker Pipeline

on:
  push:
    branches: [main]

jobs:
  train:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      # =========================
      # SETUP
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version

      # =========================
      # INSTALL
      # =========================
      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 pandas numpy scikit-learn matplotlib joblib flask

      # =========================
      # RUN MLFLOW PROJECT
      # =========================
      - name: Run MLflow Project
        run: |
          mlflow run MLProject --env-manager=local

      # =========================
      # GET RUN ID
      # =========================
      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(cat MLProject/run_id.txt)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest Run ID: $RUN_ID"

      # =========================
      # UPLOAD ARTIFACT KE GITHUB
      # =========================
      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-model-artifact
          path: |
            MLProject/model/
            MLProject/run_id.txt
          retention-days: 30

      # =========================
      # COMMIT RUN ID KE REPO
      # =========================
      - name: Save run_id to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          mkdir -p artifacts
          cp MLProject/run_id.txt artifacts/run_id.txt
          echo "Run ID: $RUN_ID" > artifacts/latest_run_info.txt
          echo "Timestamp: $(date)" >> artifacts/latest_run_info.txt
          git add artifacts/
          git diff --staged --quiet || git commit -m "CI: save MLflow run_id [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      # =========================
      # COPY MODEL KE MLPROJECT
      # =========================
      - name: Copy model to MLProject for Docker build
        run: |
          cp -r MLProject/model MLProject/model_docker || true
          ls -la MLProject/

      # =========================
      # BUILD DOCKER (CUSTOM DOCKERFILE)
      # =========================
      - name: Build Docker Model
        run: |
          cd MLProject
          docker build \
            --build-arg MODEL_PATH=model \
            -t insurance-model:latest \
            -f Dockerfile .

      # =========================
      # DOCKER LOGIN
      # =========================
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # TAG & PUSH
      # =========================
      - name: Tag Docker Image
        run: |
          docker tag insurance-model:latest ${{ secrets.DOCKER_USERNAME }}/insurance-model:latest
          docker tag insurance-model:latest ${{ secrets.DOCKER_USERNAME }}/insurance-model:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/insurance-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/insurance-model:${{ github.sha }}
          echo "Docker pushed: ${{ secrets.DOCKER_USERNAME }}/insurance-model:latest"

      - name: Logout
        run: docker logout